# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\n \
[󱞪](fg:bright-black) \
"""
[username]
disabled = false
format = "[](fg:blue)[ 󰘳 $user ]($style)[](fg:blue) "
show_always = true
style_root = "bg:blue fg:bright-black"
style_user = "bg:blue fg:bright-black"

[directory]
format = "[](fg:white)[ $path ]($style)[](fg:white) "
style = "bg:white fg:bright-black"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:white)[ $symbol $branch ]($style)[](fg:white) "
style = "bg:white fg:bright-black"
symbol = ""

