# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\n \
[󱞪](fg:magenta) \
"""

[directory]
format = "[](fg:white)[ $path ]($style)[](fg:white) "
style = "bg:white fg:black"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:black"
symbol = " "

[git_branch]
format = "[](fg:white)[ $symbol $branch ]($style)[](fg:white) "
style = "bg:white fg:black"
symbol = ""

[username]
disabled = false
format = "[](fg:cyan)[ 󰘳 $user ]($style)[](fg:cyan) "
show_always = true
style_root = "bg:cyan fg:black"
style_user = "bg:cyan fg:black"

